<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📻 手绘收音机 · 正在播放</title>
<style>
  :root { --beat: .9s; }              /* 节拍:约 66 BPM,所有动画以它为基准 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 40%, #FFF9F0 0%, #FFEFD9 58%, #FFE2C9 100%);
    overflow: hidden;
  }
  h1 { font-size: 22px; font-weight: 800; color: #5b4632; letter-spacing: 1px; }
  .caption { font-size: 14px; color: #9a8266; font-weight: 600; }
  svg.radio { width: min(560px, 88vw); height: auto; }

  /* 所有部件的旋转/缩放都以 viewBox 坐标为基准 */
  .groove, .antenna, .speaker, .speaker .arc, .knob, .tick { transform-box: view-box; }

  /* 整机随节拍摇摆 + 弹跳(原地位形) */
  .groove {
    transform-origin: 508px 750px;
    animation: groove calc(var(--beat) * 2) ease-in-out infinite;
    will-change: transform;
  }
  @keyframes groove {
    0%, 50%, 100% { transform: rotate(0deg) translateY(0); }
    25%           { transform: rotate(-1.2deg) translateY(-7px); }
    75%           { transform: rotate(1.2deg) translateY(-7px); }
  }

  /* 天线以根部为轴轻轻摆动 */
  .antenna { transform-origin: 699px 358px; animation: antenna calc(var(--beat) * 2) ease-in-out infinite; }
  @keyframes antenna {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(3.5deg); }
    70%      { transform: rotate(-2.5deg); }
  }

  /* 喇叭随节拍"泵动"( Woofer in-and-out ) */
  .speaker { transform-origin: 407px 557px; animation: pump var(--beat) ease-in-out infinite; }
  @keyframes pump {
    0%, 100% { transform: scale(1); }
    35%      { transform: scale(1.035); }
    70%      { transform: scale(.988); }
  }
  /* 内圈喇叭纹路稍微更大更慢一点点,做出纵深 */
  .speaker .arc { transform-origin: 407px 557px; animation: pumpArc var(--beat) ease-in-out infinite; }
  .speaker .arc2 { animation-delay: .06s; }
  .speaker .arc3 { animation-delay: .12s; }
  @keyframes pumpArc {
    0%, 100% { transform: scale(1); }
    35%      { transform: scale(1.06); }
    70%      { transform: scale(.985); }
  }

  /* 调频刻度盘:5 根刻度变成跳动的均衡器(从底部向上生长) */
  .tick { animation: eq var(--beat) ease-in-out infinite; opacity: .5; }
  .t1 { transform-origin: 597px 458px; }
  .t2 { transform-origin: 623px 453px; animation-delay: .12s; }
  .t3 { transform-origin: 650px 459px; animation-delay: .24s; }
  .t4 { transform-origin: 678px 453px; animation-delay: .36s; }
  .t5 { transform-origin: 705px 458px; animation-delay: .48s; }
  @keyframes eq {
    0%, 100% { transform: scaleY(.35); opacity: .45; }
    50%      { transform: scaleY(1);    opacity: 1; }
  }
  /* 调频指针左右游走,像在搜台 */
  .needle { animation: tune calc(var(--beat) * 4) ease-in-out infinite; transform-box: view-box; }
  @keyframes tune {
    0%, 100% { transform: translateX(0); }
    30%      { transform: translateX(-9px); }
    65%      { transform: translateX(8px); }
  }

  /* 两个旋钮轮流被"按下去" */
  .knob { animation: knob var(--beat) ease-in-out infinite; }
  .kl { transform-origin: 612px 589px; }
  .kr { transform-origin: 710px 585px; animation-delay: calc(var(--beat) * .5); }
  @keyframes knob {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.09); }
  }

  /* 侧边声波:向外扩散并呼吸 */
  .wave { animation: wave calc(var(--beat) * 2) ease-out infinite; opacity: .25; }
  .w2 { animation-delay: calc(var(--beat) * .35); }
  @keyframes wave {
    0%, 100% { transform: translateX(0);    opacity: .2; }
    45%      { transform: translateX(-12px); opacity: .95; }
  }

  /* 音符从喇叭飘出,一路摇摇摆摆向上消散 */
  .note {
    font-size: 72px; font-weight: 700;
    transform-box: fill-box; transform-origin: 50% 50%;
    opacity: 0;
    animation: floatNote calc(var(--beat) * 4) ease-in-out infinite;
  }
  .n1 { animation-delay: 0s; }
  .n2 { animation-delay: calc(var(--beat) * 1); font-size: 58px; }
  .n3 { animation-delay: calc(var(--beat) * 2); }
  .n4 { animation-delay: calc(var(--beat) * 3); font-size: 62px; }
  @keyframes floatNote {
    0%   { transform: translate(0,0)        rotate(-8deg)  scale(.5); opacity: 0; }
    14%  { opacity: .95; }
    40%  { transform: translate(16px,-95px) rotate(9deg)   scale(1);  opacity: .85; }
    70%  { transform: translate(-10px,-180px) rotate(-9deg) scale(.9); opacity: .45; }
    100% { transform: translate(8px,-255px) rotate(12deg)  scale(.78); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .note { opacity: .8; }
  }
  body { background: transparent; padding: 0; gap: 0; }
  h1, .caption { display: none; }
  svg.radio { width: min(560px, 100vw, 100vh); }
  .groove, .antenna, .speaker, .speaker .arc, .tick, .needle, .knob, .wave, .note {
    animation-iteration-count: infinite;
    animation-fill-mode: both;
    animation-play-state: paused;
  }
  body.playing:not(.paused) * { animation-play-state: running; }
</style>
</head>
<body>

      <!-- 双旋钮:轮流按压 -->
      <g fill="#141413">

      </g>
    </g>

    <!-- 飘出的音符(独立于整机,运动更干净) -->
    <g class="notes">
      <text class="note n1" x="385" y="425" fill="#141413">♪</text>

  </svg>

  <p class="caption">♪ 喇叭在振动 · 均衡器在跳 · 指针在搜台 · 音符飘出来了…</p>
<script>
  let started = false;
  function playRadio(reducedMotion) {
    if (started) return;
    started = true;
    if (reducedMotion) {
      document.querySelectorAll('*').forEach(element => element.style.animation = 'none');
    }
    document.body.classList.add('playing');
  }
</script>
</body>
